<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #221e1a; color: #efe6d2; font-family: "Caveat", cursive; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 32px 0; }
  h1 { margin: 0; font-size: 44px; font-weight: 600; }
  .sub { margin: 0; color: #a99c88; font-size: 22px; }
  nav { margin-top: 8px; font-size: 22px; }
  nav a { color: #d9c7a3; margin-right: 18px; }
  section { max-width: 1132px; margin: 0 auto; }
  iframe { display: block; width: 100%; border: 0; height: 900px; }
  hr { max-width: 1068px; border: 0; border-top: 1px dashed #5a5047; margin: 8px auto; }
</style>
</head>
<body>
<header>
  <h1>Sketches</h1>
  <p class="sub">From the novels of Shirley Jackson</p>
  <nav><a href="#blackwood">The Blackwood Property</a><a href="#hill-house">Hill House</a></nav>
</header>
<section id="blackwood"><iframe src="blackwood-map/" title="The Blackwood Property"></iframe></section>
<hr>
<section id="hill-house"><iframe src="hill-house/" title="Hill House"></iframe></section>
<script>
// size each sketch to its full height so the page scrolls as one
function fit(f) {
  try { f.style.height = f.contentDocument.body.offsetHeight + 'px'; } catch (e) {}
}
document.querySelectorAll('iframe').forEach(f => {
  f.addEventListener('load', () => { fit(f); setTimeout(() => fit(f), 600); });
});
addEventListener('resize', () => document.querySelectorAll('iframe').forEach(fit));
</script>
</body>
</html>
