<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketches</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  /* matches the look of ajx42.github.io (notes page) */
  ::selection { background: #cc0000; color: #fff; }
  body { background: #fff; color: #000; font-family: 'Spectral', serif; font-size: 1.1rem; margin: 0; padding: 0; }
  body::after {
    content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(to bottom, transparent, transparent 3px, rgba(0,0,0,.04) 3px, rgba(0,0,0,.04) 4px);
    pointer-events: none; z-index: 9999;
  }
  .page { max-width: 1100px; margin: 0 auto; padding: 4rem 2rem; }
  a { color: #cc0000; text-decoration: none; border-bottom: 2px solid #cc0000; transition: background .05s, color .05s; }
  a:hover { background: #cc0000; color: #fff; }
  .back { font-family: 'Press Start 2P', cursive; font-size: .55rem; margin-bottom: 3rem; display: inline-block; }
  h1 { font-family: 'Press Start 2P', cursive; font-size: 1.5rem; margin: 0 0 1rem; position: relative; }
  #typewriter { animation: glitch 3s infinite; }
  @keyframes glitch {
    0% { text-shadow: none; transform: translate(0); }
    20% { text-shadow: -2px 0 #cc0000; transform: translate(2px, -1px); }
    40% { text-shadow: 2px 0 #4a9edd; transform: translate(-2px, 1px); }
    60% { text-shadow: -2px 0 #cc0000; transform: translate(1px, 0); }
    80% { text-shadow: 2px 0 #4a9edd; transform: translate(-1px, 1px); }
    100% { text-shadow: none; transform: translate(0); }
  }
  .cursor { display: inline-block; animation: blink 1s step-end infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .sub { margin: 0 0 1.5rem; font-style: italic; }
  nav { margin-bottom: 2.5rem; }
  nav a { margin-right: 1.5rem; }
  .sketch { margin: 0 -16px 3rem; }
  iframe { display: block; width: 100%; border: 0; height: 900px; background: transparent; }
</style>
</head>
<body>
<div class="page">
  <a href="../notes.html" class="back">&lt; back</a>
  <h1><span id="typewriter"></span><span class="cursor">_</span></h1>
  <p class="sub">From the novels of Shirley Jackson</p>
  <nav><a href="#blackwood">The Blackwood Property</a><a href="#hill-house">Hill House</a></nav>
  <section class="sketch" id="blackwood"><iframe src="blackwood-map/" title="The Blackwood Property"></iframe></section>
  <section class="sketch" id="hill-house"><iframe src="hill-house/" title="Hill House"></iframe></section>
</div>
<script>
  const text = "Sketches", el = document.getElementById("typewriter");
  let i = 0;
  (function type() { if (i < text.length) { el.textContent += text[i++]; setTimeout(type, 120); } })();

  // size each sketch to its full height so the page scrolls as one
  function fit(f) { try { f.style.height = f.contentDocument.body.offsetHeight + 'px'; } catch (e) {} }
  document.querySelectorAll('iframe').forEach(f => f.addEventListener('load', () => { fit(f); setTimeout(() => fit(f), 600); }));
  addEventListener('resize', () => document.querySelectorAll('iframe').forEach(fit));
</script>
</body>
</html>
