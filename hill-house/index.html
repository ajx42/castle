<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hill House Plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<style>
  :root { --paper: #ebe6da; --pencil: #34302b; --soft: #857c70; --red: #8e2f2a; --cold: #4f7287; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1d1b1a; color: var(--pencil); font-family: "Caveat", cursive; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .sheet { min-width: 0; background: var(--paper); border-radius: 2px; padding: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.6); position: relative; }
  h1 { margin: 0; font-size: 34px; font-weight: 600; }
  .sub { margin: 0; color: var(--soft); font-size: 20px; }
  .note { margin: 2px 0 6px; color: var(--soft); font-size: 17px; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: "Caveat", cursive; fill: var(--pencil); pointer-events: none;
    paint-order: stroke; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; }
  .spot { cursor: pointer; }
  .hit { fill: transparent; stroke: none; }
  .spot .hit { pointer-events: all; }
  .spot:hover path:not(.hit) { stroke: var(--red); }
  .spot:hover text { fill: var(--red); }
  #shifted { position: absolute; right: 18px; top: 18px; font-size: 22px; color: var(--red);
    opacity: 0; transition: opacity 1.2s; }
  #shifted.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <section class="sheet">
    <h1>Hill House</h1>
    <p class="sub"><cite>The Haunting of Hill House</cite></p>
    <div id="shifted">the house has shifted</div>
    <svg viewBox="0 0 1000 720" id="plan" role="img" aria-label="Sketched floor plans of Hill House">
      <defs>
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/>
          <feColorMatrix in="n" type="matrix" values="0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .25  0 0 0 .08 0"/>
        </filter>
      </defs>
      <rect width="1000" height="720" fill="var(--paper)"/>
      <rect width="1000" height="720" filter="url(#grain)"/>
      <g id="layer"></g>
    </svg>
  </section>
</main>
<script>
const notes = {
  veranda: "The veranda runs around the whole house. It's easy to lose track of which side you're on.",
  front: "The front door, under the porch. The first thing Eleanor sees of the house.",
  hall: "The main hall and the great staircase, the centre everything else opens off.",
  drawing: "The drawing room on the outer ring, with windows onto the veranda.",
  dining: "The dining room, where meals are laid out and cleared away on a strict schedule.",
  kitchen: "The kitchen, with an odd number of doors leading out of it. Mrs. Dudley's domain.",
  game: "The game room, where the guests gather in the evenings.",
  parlor: "A parlor at the front of the house.",
  inner: "Rooms in the middle of the house with no windows at all: the plan is built in rings, rooms inside rooms.",
  tower: "The tower, with the library at its base and an iron spiral stair climbing up inside.",
  blue: "The blue room, Eleanor's bedroom.",
  green: "The green room, Theodora's, next to Eleanor's.",
  luke: "Luke's room.",
  doctor: "Dr. Montague's room.",
  nursery: "The nursery at the end of the hall. Outside its door is a patch of air that is always cold.",
  cold: "The cold spot outside the nursery door.",
  writing: "The upstairs hall, where writing appears on the wall.",
  stairtop: "The top of the great staircase.",
  towertop: "The tower from above: the iron stair keeps climbing past this floor."
};

const svg = document.getElementById('plan'), layer = document.getElementById('layer');
const rc = rough.svg(svg), NS = 'http://www.w3.org/2000/svg';
let s, rnd;
const reseed = (seed) => { s = seed; rnd = () => (s = (s * 16807) % 2147483647) / 2147483647; };
const pencil = { stroke: '#34302b', strokeWidth: 1.3, roughness: 1.5, bowing: 1.4 };
const o = (x) => Object.assign({}, pencil, { seed: Math.floor(rnd() * 1e6) + 1 }, x);
const J = 5; // how far walls drift from true
const j = () => (rnd() - .5) * 2 * J;

function group(id, parent = layer) {
  const g = document.createElementNS(NS, 'g');
  if (id) { g.classList.add('spot'); g.dataset.id = id;
    if (notes[id]) { const t = document.createElementNS(NS, 'title'); t.textContent = notes[id]; g.appendChild(t); } }
  parent.appendChild(g); return g;
}
function label(g, x, y, txt, size = 22, rot = 0) {
  const t = document.createElementNS(NS, 'text');
  t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('font-size', size);
  t.setAttribute('text-anchor', 'middle');
  if (rot) t.setAttribute('transform', `rotate(${rot} ${x} ${y})`);
  t.textContent = txt; g.appendChild(t);
}
function hit(g, pts) {
  const p = document.createElementNS(NS, 'path'); p.classList.add('hit');
  p.setAttribute('d', 'M' + pts.map(q => q.join(' ')).join(' L') + ' Z'); g.appendChild(p);
}
// a room whose corners are each pushed slightly off true
function room(parent, id, x, y, w, h, name, extra = {}) {
  const g = group(id, parent);
  const pts = [[x + j(), y + j()], [x + w + j(), y + j()], [x + w + j(), y + h + j()], [x + j(), y + h + j()]];
  hit(g, pts);
  g.appendChild(rc.polygon(pts, o(Object.assign({ strokeWidth: 1.8 }, extra))));
  if (name) label(g, x + w / 2 + j() / 2, y + h / 2 + 7, name, extra.size || 22, (rnd() - .5) * 4);
  return g;
}
function doors(g, list) { // short ticks marking doorways
  list.forEach(([x, y, vertical]) => g.appendChild(vertical
    ? rc.line(x, y - 7, x, y + 7, o({ stroke: '#ebe6da', strokeWidth: 5, roughness: .3 }))
    : rc.line(x - 7, y, x + 7, y, o({ stroke: '#ebe6da', strokeWidth: 5, roughness: .3 }))));
}
function spiral(g, cx, cy, r) {
  const pts = []; for (let a = 0; a < Math.PI * 6; a += .3) { const rr = r * (1 - a / (Math.PI * 6.6)); pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
  g.appendChild(rc.curve(pts, o({ strokeWidth: 1, roughness: .8 })));
}
function stairs(g, x, y, w, h, n) {
  g.appendChild(rc.rectangle(x, y, w, h, o({ strokeWidth: 1 })));
  for (let i = 1; i < n; i++) g.appendChild(rc.line(x, y + i * h / n, x + w, y + i * h / n, o({ strokeWidth: .8, roughness: .8 })));
}

function render(seed) {
  reseed(seed);
  layer.replaceChildren();

  // ================= GROUND FLOOR =================
  const gf = group(); gf.setAttribute('transform', `rotate(${(rnd() - .5) * 2.4} 290 380) skewX(${(rnd() - .5) * 3})`);
  label(gf, 290, 52, 'ground floor', 30);

  // veranda all the way round
  const v = group('veranda', gf);
  hit(v, [[40, 80], [540, 80], [540, 660], [40, 660]]);
  v.appendChild(rc.rectangle(42, 82, 496, 576, o({ stroke: '#857c70', strokeLineDash: [10, 6], strokeWidth: 1.4 })));
  for (let x = 60; x < 530; x += 40) { v.appendChild(rc.circle(x, 90, 6, o({ strokeWidth: .9 }))); v.appendChild(rc.circle(x, 650, 6, o({ strokeWidth: .9 }))); }
  label(v, 290, 108, 'the veranda, all the way round', 20);

  // outer ring
  room(gf, 'drawing', 75, 125, 160, 150, 'drawing room');
  room(gf, 'dining', 235, 125, 150, 150, 'dining room');
  const k = room(gf, 'kitchen', 385, 125, 120, 200, 'kitchen');
  doors(k, [[385, 160, true], [385, 270, true], [440, 125, false], [505, 200, true], [440, 325, false]]);
  room(gf, 'game', 75, 275, 110, 170, 'game room', { size: 20 });
  room(gf, 'parlor', 75, 445, 150, 135, 'parlor');

  // inner, windowless rooms
  const inner = group('inner', gf);
  room(inner, null, 185, 275, 200, 170, null, { fill: 'rgba(52,48,43,.12)', fillStyle: 'cross-hatch', hachureGap: 9 });
  label(inner, 285, 352, 'inner rooms', 22); label(inner, 285, 376, '(no windows)', 18);
  room(gf, null, 385, 325, 120, 120, 'small room', { size: 19 });

  // hall + great staircase
  const hall = room(gf, 'hall', 225, 445, 160, 135, null);
  stairs(hall, 240, 455, 50, 90, 9);
  label(hall, 330, 520, 'main hall', 22);
  room(gf, null, 385, 445, 120, 135, 'side room', { size: 19 });

  // front door + porch
  const fd = group('front', gf);
  hit(fd, [[270, 575], [350, 575], [350, 640], [270, 640]]);
  fd.appendChild(rc.rectangle(285, 576, 50, 12, o({ fill: '#34302b', fillStyle: 'solid' })));
  fd.appendChild(rc.line(275, 612, 345, 612, o({ strokeWidth: 1 })));
  label(fd, 310, 632, 'front door', 19);

  // tower with library
  const tw = group('tower', gf);
  hit(tw, [[455, 520], [565, 520], [565, 640], [455, 640]]);
  tw.appendChild(rc.circle(510 + j(), 585 + j(), 110, o({ strokeWidth: 2, fill: 'rgba(52,48,43,.08)', fillStyle: 'hachure', hachureGap: 7 })));
  spiral(tw, 510, 585, 34);
  label(tw, 510, 650, 'library (tower)', 20);

  // ================= UPPER FLOOR =================
  const uf = group(); uf.setAttribute('transform', `rotate(${(rnd() - .5) * 2.4} 790 380) skewY(${(rnd() - .5) * 2})`);
  label(uf, 790, 52, 'upstairs', 30);
  // long hall
  const hw = group('writing', uf);
  hit(hw, [[740, 100], [840, 100], [840, 600], [740, 600]]);
  hw.appendChild(rc.rectangle(745, 105, 90, 490, o({ strokeWidth: 1.6 })));
  label(hw, 790, 360, 'hall', 22, -90);
  // scrawl on the wall
  hw.appendChild(rc.curve([[750, 230], [760, 226], [770, 234], [780, 224], [792, 232], [804, 225], [815, 233], [828, 227]], o({ stroke: '#8e2f2a', strokeWidth: 1.2, roughness: 2.5 })));
  hw.appendChild(rc.curve([[752, 244], [766, 238], [778, 246], [790, 239], [806, 247], [824, 240]], o({ stroke: '#8e2f2a', strokeWidth: 1.2, roughness: 2.5 })));

  room(uf, 'blue', 625, 120, 120, 120, 'blue room');
  room(uf, 'green', 625, 240, 120, 110, 'green room');
  room(uf, 'luke', 835, 120, 125, 120, "Luke's room", { size: 20 });
  room(uf, 'doctor', 835, 240, 125, 110, "the doctor's", { size: 20 });
  room(uf, null, 625, 350, 120, 120, 'spare', { size: 19 });
  const st = group('stairtop', uf);
  hit(st, [[835, 350], [960, 350], [960, 470], [835, 470]]);
  stairs(st, 850, 365, 50, 90, 9); label(st, 925, 420, 'stairs', 19);

  // nursery at end of hall + cold spot outside its door
  room(uf, 'nursery', 680, 520, 220, 120, 'the nursery');
  const cold = group('cold', uf);
  hit(cold, [[760, 470], [820, 470], [820, 525], [760, 525]]);
  cold.appendChild(rc.circle(790, 498, 46, o({ stroke: '#4f7287', strokeLineDash: [4, 4], fill: 'rgba(79,114,135,.28)', fillStyle: 'dots', hachureGap: 5, roughness: 1 })));
  label(cold, 790, 503, 'cold', 18);

  // tower continuing up
  const tt = group('towertop', uf);
  hit(tt, [[900, 560], [990, 560], [990, 660], [900, 660]]);
  tt.appendChild(rc.circle(945, 610, 80, o({ strokeWidth: 2 })));
  spiral(tt, 945, 610, 26);
  label(tt, 945, 672, 'tower stair', 19);
}

let seed = 1959;
render(seed);
// when you come back to the tab, the house has moved
let wasHidden = false;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { wasHidden = true; return; }
  if (wasHidden) {
    wasHidden = false;
    render(++seed * 7919);
    const n = document.getElementById('shifted'); n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 2500);
  }
});
</script>
</body>
</html>
